<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Astral Games</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; }
html, body {
    width:100%; height:100%; background:#000; overflow:auto; color:white;
}
body {
    background: radial-gradient(circle at center, #020408 0%, #000 70%);
}
body::before {
    content:""; position:fixed; inset:0;
    background: radial-gradient(circle at center, rgba(40,70,140,0.15), transparent 45%);
    z-index:0; pointer-events:none;
}
canvas { position:fixed; inset:0; z-index:1; pointer-events:none; }

.title {
    position:absolute; top:40px; left:50%; transform:translateX(-50%);
    font-size: clamp(60px, 10vw, 100px); font-weight:800; z-index:10;
    background: linear-gradient(90deg, #10264d, #1c4d95, #4f8df0, #1c4d95, #10264d);
    background-size: 220%; -webkit-background-clip: text; color: transparent;
    animation: flow 8s ease-in-out infinite;
}
@keyframes flow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

.grid {
    position:relative; top:160px; left:50%; transform:translateX(-50%);
    width:95%; max-width: 2100px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap:24px;
    z-index:2;
    padding-bottom: 150px;
}

.game {
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer; transition:0.3s ease;
}
.icon-box {
    width:100%; aspect-ratio:1/1;
    border-radius:22px; overflow:hidden; background:#0f1624;
    border:4px solid transparent; transition:0.3s ease;
}
.icon-box img {
    width:100%; height:100%; object-fit:cover;
}
.game-name {
    font-size:14px; color:#ddd; text-align:center; line-height:1.3;
}
.game:hover { transform:translateY(-10px) scale(1.03); }
.game:hover .icon-box { 
    border-color: #4f8df0; 
    box-shadow: 0 0 35px rgba(79,141,240,0.6); 
}
.header {
    position:fixed; top:15px; left:50%; transform:translateX(-50%);
    z-index:20; color:rgba(255,255,255,0.75); font-size:15px; pointer-events:none;
}

/* Zone Viewer (same page loading) */
#zoneViewer {
    display: none; position: fixed; inset: 0; z-index: 100; background: #000;
    flex-direction: column;
}
.zone-header {
    background: linear-gradient(135deg, #1a2338, #0f1624); padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center; z-index: 101;
}
.zone-title { font-size: 22px; font-weight: bold; }
.zone-controls button {
    margin-left: 10px; padding: 8px 16px; background: #4f8df0; color: white;
    border: none; border-radius: 8px; cursor: pointer;
}
#zoneFrame {
    flex: 1; border: none; background: #000;
}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="header">Astral Games • Full gn-math Collection</div>
<div class="title">Games</div>
<div class="grid" id="gameGrid"></div>

<!-- Zone Viewer -->
<div id="zoneViewer">
    <div class="zone-header">
        <div class="zone-title" id="zoneName">Loading...</div>
        <div class="zone-controls">
            <button onclick="fullscreenZone()">Fullscreen</button>
            <button onclick="closeZone()">Close</button>
        </div>
    </div>
    <iframe id="zoneFrame"></iframe>
</div>

const grid = document.getElementById('gameGrid');

games.forEach(game => {
    const div = document.createElement('div');
    div.className = 'game';
    div.innerHTML = `
        <div class="icon-box">
            <img src="${game.cover}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/200/111827/ffffff?text=${encodeURIComponent(game.name.substring(0,12))}'">
        </div>
        <div class="game-name">${game.name}</div>
    `;
    div.onclick = () => openGame(game.id, game.name);
    grid.appendChild(div);
});

// Open game in same page (original behavior)
function openGame(id, name) {
    document.getElementById('zoneName').textContent = name;
    document.getElementById('zoneViewer').style.display = 'flex';
    
    const frame = document.getElementById('zoneFrame');
    frame.src = `https://cdn.jsdelivr.net/gh/freebuisness/html@main/${id}.html`;
}

function closeZone() {
    const viewer = document.getElementById('zoneViewer');
    const frame = document.getElementById('zoneFrame');
    viewer.style.display = 'none';
    frame.src = ''; // Clear iframe
}

function fullscreenZone() {
    const frame = document.getElementById('zoneFrame');
    if (frame.requestFullscreen) frame.requestFullscreen();
}

// Snow Effect
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");
let w, h, particles = [];

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    particles = [];
    for(let i = 0; i < 300; i++) {
        particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 3 + 0.5,
            speedY: Math.random() * 1.2 + 0.3,
            sway: Math.random() * 2.5,
            swaySpeed: Math.random() * 0.025 + 0.01,
            alpha: Math.random() * 0.8 + 0.3
        });
    }
}

function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
        p.y += p.speedY;
        p.x += Math.sin(p.y * p.swaySpeed) * p.sway;
        if (p.y > h) p.y = -20;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 240, 255, ${p.alpha})`;
        ctx.fill();
    });
    requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);
resize();
draw();
</script>
