<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAIL MARY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
html,body{
    width:100%;
    height:100%;
    overflow-y:auto;
    background:#000;
}
body{
    background:radial-gradient(circle at center,#020408 0%,#000 70%);
    color:#fff;
    position:relative;
}
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at center,rgba(32,60,120,0.18),transparent 35%),
        radial-gradient(circle at center,rgba(60,100,190,0.08),transparent 55%);
    z-index:0;
    pointer-events:none;
}
canvas{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    padding:20px;
    text-align:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(8px);
}
.title{
    font-size:clamp(42px,9vw,78px);
    font-weight:800;
    background:linear-gradient(90deg,#10264d,#1c4d95,#4f8df0,#1c4d95,#10264d);
    background-size:220%;
    -webkit-background-clip:text;
    color:transparent;
    animation:flow 8s ease-in-out infinite;
}
@keyframes flow{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
}

/* GAME GRID */
main{
    position:relative;
    z-index:2;
    padding-top:120px;
    padding-bottom:100px;
}
.grid-layout{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:24px;
    padding:0 5vw;
    max-width:1800px;
    margin:0 auto;
}
.game-card{
    background:rgba(20,20,30,0.85);
    border:1px solid rgba(80,120,255,0.3);
    border-radius:16px;
    overflow:hidden;
    transition:0.3s ease;
    cursor:pointer;
}
.game-card:hover{
    transform:scale(1.06);
    box-shadow:0 0 30px rgba(80,140,255,0.4);
}
.card-thumb{
    width:100%;
    height:180px;
    object-fit:cover;
}
.card-body{
    padding:14px;
}
.card-title{
    font-size:1.1rem;
    margin-bottom:6px;
}

/* BOTTOM BAR */
.bottom-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:30px;
    background:rgba(10,10,15,0.85);
    backdrop-filter:blur(10px);
    z-index:100;
    border-top:1px solid rgba(80,120,255,0.3);
}
.bar-btn{
    width:56px;
    height:56px;
    border:none;
    border-radius:16px;
    background:rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.2s;
}
.bar-btn:hover{
    background:rgba(80,140,255,0.3);
    transform:scale(1.1);
}
.bar-btn img{
    width:32px;
    height:32px;
    filter:brightness(0.9);
}

/* SEARCH */
.search-container{
    text-align:center;
    margin:30px 0;
}
.search{
    width:min(620px,90vw);
    padding:16px 24px;
    border-radius:999px;
    border:none;
    outline:none;
    background:#121212;
    color:white;
    font-size:17px;
    box-shadow:0 0 0 2px rgba(80,140,255,0.4),
               0 0 25px rgba(80,140,255,0.25);
}
</style>
</head>
<body>

<canvas id="snow"></canvas>

<header>
    <div class="title">GAMES</div>
</header>

<main>
    <div class="search-container">
        <input type="text" id="searchBar" class="search" placeholder="Search games...">
    </div>

    <div class="grid-layout" id="allGamesGrid"></div>
</main>

<!-- Bottom Bar -->
<div class="bottom-bar">
    <button class="bar-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Home">
    </button>
    <button class="bar-btn" onclick="window.location.reload()">
        <img src="https://cdn-icons-png.flaticon.com/512/709/709606.png" alt="Refresh">
    </button>
</div>

<!-- Zone Viewer -->
<div id="zoneViewer" style="display:none;position:fixed;inset:0;background:#000;z-index:200;flex-direction:column;">
    <div style="padding:15px 20px;background:#111;display:flex;justify-content:space-between;align-items:center;">
        <h2 id="zoneName" style="color:#4f8df0;margin:0;">Loading...</h2>
        <button onclick="closeZone()" style="padding:8px 16px;background:#c00;color:white;border:none;border-radius:8px;cursor:pointer;">Close</button>
    </div>
    <iframe id="zoneFrame" style="flex:1;width:100%;border:none;"></iframe>
</div>

<script>
// Snow / Falling Particles
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");
let w, h, particles = [];

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    particles = [];
    for(let i = 0; i < 280; i++) {
        particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 2.5 + 0.8,
            speedY: Math.random() * 1.2 + 0.4,
            sway: Math.random() * 1.5,
            alpha: Math.random() * 0.7 + 0.3
        });
    }
}

function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
        p.y += p.speedY;
        p.x += Math.sin(p.y * 0.008) * p.sway;
        if (p.y > h) p.y = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,220,255,${p.alpha})`;
        ctx.fill();
    });
    requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);
resize();
draw();

// Game Data & Logic
const CONFIG = {
    zones: "https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json",
    covers: "https://cdn.jsdelivr.net/gh/freebuisness/covers@main",
    html: "https://cdn.jsdelivr.net/gh/freebuisness/html@main"
};

let state = { games: [] };

async function init() {
    try {
        const res = await fetch(CONFIG.zones + "?t=" + Date.now());
        state.games = await res.json();
        renderGames();
    } catch(e) {
        console.error(e);
        document.getElementById('allGamesGrid').innerHTML = `<p style="color:#666;text-align:center;grid-column:1/-1;padding:50px;">Failed to load games</p>`;
    }
}

function resolveUrl(u) {
    return u.replace("{COVER_URL}", CONFIG.covers).replace("{HTML_URL}", CONFIG.html);
}

function createCard(g) {
    return `
    <div class="game-card" onclick="openGame(${g.id})">
        <img src="${resolveUrl(g.cover)}" class="card-thumb" loading="lazy">
        <div class="card-body">
            <div class="card-title">${g.name}</div>
        </div>
    </div>`;
}

function renderGames() {
    document.getElementById('allGamesGrid').innerHTML = state.games.map(g => createCard(g)).join('');
}

async function openGame(id) {
    const g = state.games.find(x => x.id === id);
    if (!g) return;

    document.getElementById('zoneName').textContent = g.name;
    document.getElementById('zoneViewer').style.display = 'flex';

    try {
        const url = resolveUrl(g.url);
        const resp = await fetch(url + "?t=" + Date.now());
        const html = await resp.text();
        const frame = document.getElementById('zoneFrame');
        frame.contentDocument.open();
        frame.contentDocument.write(html);
        frame.contentDocument.close();
    } catch(e) {
        alert("Failed to load game");
    }
}

function closeZone() {
    document.getElementById('zoneViewer').style.display = 'none';
}

// Search
document.getElementById('searchBar').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = state.games.filter(g => g.name.toLowerCase().includes(term));
    document.getElementById('allGamesGrid').innerHTML = filtered.map(g => createCard(g)).join('');
});

init();
</script>
</body>
</html>
